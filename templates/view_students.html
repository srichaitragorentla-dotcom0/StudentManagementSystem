<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>View Students</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>All Students</h1>

    {% if students %}

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
        </tr>

        {% endfor %}

    </table>

    {% else %}

    <p>No students found.</p>

    {% endif %}

    <br>

    <a href="/">Back to Home</a>

</div>

</body>
</html>
